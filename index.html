<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DMC - Regístrate y Participa</title>
<meta name="description" content="Regístrate y participa para ganar premios cortesía de nuestros patrocinadores.">
<style>
  /* === COLORES: cambia aquí los de tu marca === */
  :root{
    --color-fondo:#050914;
    --color-fondo-2:#0b1330;
    --color-primario:#d7191f;
    --color-secundario:#1b3fa6;
    --color-texto:#ffffff;
    --color-texto-suave:#b9c0d6;
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--color-texto);
    background:
      repeating-linear-gradient(115deg,transparent 0 14px,#ffffff0d 14px 15px),
      linear-gradient(160deg,#050914 0%,#0a1230 55%,#3a0b16 100%);
    background-attachment:fixed;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:32px 20px 48px;text-align:center}
  .logo{width:140px;height:140px;object-fit:contain;margin:0 auto 16px;display:block}
  .logo-placeholder{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
    font-weight:800;font-size:14px;letter-spacing:.1em;color:#000;
    background:linear-gradient(135deg,var(--color-primario),var(--color-secundario))}
  h1{font-size:clamp(28px,7vw,40px);line-height:1.15;margin-bottom:12px}
  h1 span{background:linear-gradient(90deg,#ff3b3b,#ffffff 55%,#5b7fe8);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--color-texto-suave);margin-bottom:28px;font-size:18px}
  form{background:var(--color-fondo-2);border:1px solid #ffffff1a;border-radius:18px;padding:24px;text-align:left;
    box-shadow:0 10px 40px #0008}
  label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
  input{width:100%;padding:14px;border-radius:10px;border:1px solid #ffffff26;background:#050914;color:var(--color-texto);font-size:16px}
  input:focus{outline:2px solid #3b64d8;border-color:transparent}
  button{width:100%;margin-top:22px;padding:16px;border:0;border-radius:12px;font-size:18px;font-weight:800;
    text-transform:uppercase;letter-spacing:.04em;cursor:pointer;
    background:linear-gradient(90deg,var(--color-primario),#a30f1a);color:#fff;transition:transform .15s}
  button:hover{transform:translateY(-2px)}
  button:disabled{opacity:.6;cursor:wait}
  #msg{margin-top:16px;text-align:center;font-weight:600;min-height:24px}
  .ok{color:#4ade80}.err{color:#f87171}
  .patro{margin-top:28px;color:var(--color-texto-suave);font-size:14px}
</style>
</head>
<body>
<main class="wrap">
  <!-- Logo en SVG. Para usar tu archivo original: <img class="logo" src="assets/logo.png" alt="DMC"> -->
  <svg class="logo" viewBox="0 0 640 400" role="img" aria-label="Dominican Muscle Club" style="width:min(320px,80vw);height:auto">
    <defs><linearGradient id="b" x1="1" x2="0"><stop offset="0" stop-color="#12307f"/><stop offset="1" stop-color="#12307f" stop-opacity="0"/></linearGradient>
    <linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#e0201f"/><stop offset="1" stop-color="#e0201f" stop-opacity="0"/></linearGradient>
    <linearGradient id="r2" x1="1" x2="0"><stop offset="0" stop-color="#e0201f"/><stop offset="1" stop-color="#e0201f" stop-opacity="0"/></linearGradient>
    <linearGradient id="b2" x1="0" x2="1"><stop offset="0" stop-color="#12307f"/><stop offset="1" stop-color="#12307f" stop-opacity="0"/></linearGradient></defs>
    <polygon points="190,60 345,60 335,115 175,115" fill="url(#b)"/>
    <polygon points="410,45 520,45 505,115 395,115" fill="url(#r)"/>
    <polygon points="130,310 265,310 250,380 115,380" fill="url(#r2)"/>
    <polygon points="310,310 445,310 430,365 300,365" fill="url(#b2)"/>
    <polygon points="350,45 400,45 365,150 335,150" fill="#fff"/>
    <polygon points="320,310 345,310 305,385 275,385" fill="#fff"/>
    <text x="320" y="240" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-style="italic" font-weight="900" font-size="150" fill="#fff" textLength="500" lengthAdjust="spacingAndGlyphs">DMC</text>
    <text x="320" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-style="italic" font-weight="800" font-size="30" fill="#fff" textLength="470" lengthAdjust="spacingAndGlyphs">DOMINICAN MUSCLE CLUB</text>
  </svg>

  <h1><span>Regístrate y Participa</span><br>para ganar premios cortesía de nuestros patrocinadores</h1>
  <p class="sub">Completa tus datos y entra al sorteo.</p>

  <form id="form" novalidate>
    <label for="nombre">Nombre</label>
    <input id="nombre" name="nombre" autocomplete="given-name" required>
    <label for="apellido">Apellido</label>
    <input id="apellido" name="apellido" autocomplete="family-name" required>
    <label for="vehiculo">Nombre del vehículo</label>
    <input id="vehiculo" name="vehiculo" placeholder="Ej: Honda Civic 2018" required>
    <button type="submit" id="btn">Regístrate ahora</button>
    <div id="msg" role="status"></div>
  </form>
  <p class="patro">Premios cortesía de nuestros patrocinadores</p>
</main>

<script>
  // Pega aquí la URL de tu Google Apps Script (ver README.md)
  const SCRIPT_URL = "PEGA_AQUI_LA_URL_DE_APPS_SCRIPT";

  const form = document.getElementById('form'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    if (!data.nombre.trim() || !data.apellido.trim() || !data.vehiculo.trim()) {
      msg.className = 'err'; msg.textContent = 'Por favor completa todos los campos.'; return;
    }
    if (SCRIPT_URL.startsWith('PEGA_')) {
      msg.className = 'err'; msg.textContent = 'Falta configurar la URL del Excel (ver README).'; return;
    }
    btn.disabled = true; msg.className = ''; msg.textContent = 'Enviando...';
    try {
      await fetch(SCRIPT_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(data)});
      msg.className = 'ok'; msg.textContent = '¡Registro exitoso! Ya estás participando 🎉'; form.reset();
    } catch (err) {
      msg.className = 'err'; msg.textContent = 'No se pudo enviar. Intenta de nuevo.';
    }
    btn.disabled = false;
  });
</script>
</body>
</html>
